concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
name: Lighthouse Performance Check
# Runs in the UNTRUSTED pull request context: a fork gets no repository secrets
# and only a read-only GITHUB_TOKEN, which is what makes it safe to check out and
# execute pull request code here.
#
# This workflow deliberately does NOT comment on the pull request, because a fork
# PR's token cannot write. Commenting lives in lighthouse-comment.yml, which
# reacts to this workflow through workflow_run and never checks out PR code.
#
# Do NOT switch this workflow back to pull_request_target. That combination of
# base-repo secrets plus a fork's code executed through `yarn install` and the
# Lighthouse config is the "pwn request" vulnerability.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
permissions:
  contents: read
jobs:
  # workflow_run does not reliably carry the PR number for forks, so record it.
  pr-metadata:
    name: Record PR number
    runs-on: ubuntu-latest
    steps:
      - name: Write PR number
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt
      - name: Upload PR number
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-pr-number
          path: pr-number.txt

  # Wait for Vercel deployment once, share URL with audit jobs
  wait-for-deployment:
    name: Wait for Vercel deployment
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.vercel-deployment.outputs.url }}
    steps:
      - name: Wait for Vercel deployment
        uses: patrickedqvist/wait-for-vercel-preview@06c79330064b0e6ef7a2574603b62d3c98789125 # v1.3.2
        id: vercel-deployment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300

  # Run desktop and mobile audits in parallel
  lighthouse-audit:
    name: Lighthouse audit (${{ matrix.device }})
    needs: wait-for-deployment
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: desktop
            output-json: lighthouse-results.json
            output-html: lighthouse-desktop.html
          - device: mobile
            output-json: lighthouse-mobile-results.json
            output-html: lighthouse-mobile.html
    steps:
      # pull_request checks out the merge commit by default, so no ref override.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up NodeJS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      - name: Install Yarn
        env:
          YARN_VERSION: 1.22.22
        run: |-
          npm install -g "yarn@${YARN_VERSION}"
          yarn -v
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      # Replace localhost URLs in the shared Lighthouse URLs file, which is
      # imported by both the desktop and mobile base configs.
      - name: Replace localhost URLs with Vercel deployment URL
        env:
          DEPLOY_URL: ${{ needs.wait-for-deployment.outputs.url }}
        run: |
          set -euo pipefail
          echo "Testing against deployment: $DEPLOY_URL"
          sed -i "s|http://localhost:3000|${DEPLOY_URL}|g" lighthouse.urls.js
      - name: Run Lighthouse audit (${{ matrix.device }})
        env:
          LIGHTHOUSE_URL: ${{ needs.wait-for-deployment.outputs.url }}
          DEVICE: ${{ matrix.device }}
          OUTPUT_JSON: ${{ matrix.output-json }}
          OUTPUT_HTML: ${{ matrix.output-html }}
        run: |
          set -euo pipefail
          if [ "$DEVICE" = "desktop" ]; then
            yarn lighthouse:desktop:ci
          else
            yarn lighthouse:mobile:ci
          fi
          # Verify artifacts exist
          if [ ! -f "./${OUTPUT_JSON}" ] || [ ! -f "./${OUTPUT_HTML}" ]; then
            echo "Error: ${DEVICE} Lighthouse artifacts missing (${OUTPUT_JSON}, ${OUTPUT_HTML})."
            exit 1
          fi
      - name: Upload Lighthouse results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lighthouse-results-${{ matrix.device }}
          path: |
            ${{ matrix.output-json }}
            ${{ matrix.output-html }}
