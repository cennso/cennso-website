page:
  title: Customer Success Stories - Cennso Mobile Core Deployments
  description: Discover how organizations worldwide deploy Cennso mobile core. Real-world case studies of automated infrastructure and accelerated network innovation.
  # Friendly on-page H1/lede from the Design 4.0 frames, decoupled from the
  # SEO-tuned `title`/`description` above (same split Task 3 made for
  # /contact): those keep feeding <SEO> and the breadcrumb, these feed
  # PageHeader's on-page copy. Reads "Success Stories", the same as the nav
  # label, the route and each story's back link.
  heading: Success Stories
  subheading: Practical use cases in technology, connectivity, and digital solutions, drawing on the experience and expertise of the Cennso expert team.

content:
  description:
    - Cennso delivers products and services to our customers that enable them to take full advantage of the benefits of the latest networking technologies.
    - Our products and solutions are based on our industry-proven physical and virtual appliance platforms. We deliver purpose-built systems that follow industry-standard reference architectures and ensure best-in-class performance, scalability and reliability combined with consistent end-to-end management capabilities.
    - In addition, we offer comprehensive professional services like network consultancy, training, workshops, and custom development. From a single product delivery up to turnkey solutions, Cennso is the right partner for you.
  # The visible label, exactly as the frames draw it: the btn_More symbol
  # (1:606), instanced on every use-case row, sets "More" (1:609) in Poppins
  # Bold 18px beside a SEPARATE chevron vector (1:608). What shipped typed that
  # chevron into the copy as a ">" character, so the pill read "More info >".
  # The "< Success stories" link above each story page's title.
  backLinkLabel: Success stories
  storyLinkText: More
  # Appended visually hidden, with {title} replaced by the story's own title,
  # so the link's own text names where it goes. Two things need it, and the
  # trailing ">" was standing in for both:
  #   - Lighthouse's `link-text` SEO audit reads the anchor's innerText and
  #     blocklists bare "more" and "more info" (BLOCKLIST in lighthouse
  #     10.1.0's core/audits/seo/link-text.js). "More" on its own would fail it
  #     and take the SEO category under the 95% gate with it.
  #   - a page of links all reading "More" is useless to anyone listing them
  #     with a screen reader.
  # Hidden text rather than an aria-label because the audit above reads the
  # visible text, not the accessible name - and this way both come out the same.
  storyLinkContext: about {title}
  pagination:
    previous: Previous page
    next: Next page