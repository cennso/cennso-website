  whyCennso:
    heading: Why Cennso?
    cards:
      - title: 5G Anywhere
        description: >-
          Cennso enables you to run 5G networks in any location—from
          industrial sites to specialized facilities—with centralized
          management. Manage all distributed sites from one control plane,
          deploy high-performance configurations for low-latency
          applications, and automatically verify hardware compatibility
          remotely, without engineers onsite.
      - title: Agile MVNO
        description: >-
          Cennso gives you the agility to expand virtual network services
          rapidly. Maintain stable subscriber sessions across regions and
          cloud providers, deploy high-performance core network functions or
          integrate your own through standard interfaces, and update
          configurations or launch new data plans with automated GitOps
          workflows.
      - title: Private 5G
        description: >-
          Cennso delivers secure, dedicated 5G networks for factories, ports,
          and large campuses. Integrate with existing enterprise security and
          credential providers, deploy only the network functions your
          facility needs, and use Crossplane to unify on-site infrastructure
          with cloud services through a single workflow.

  # Visually-hidden landmark heading for the 4-card stat grid - the design
  # has no on-canvas label for this section, so this exists only for
  # screen-reader/outline structure (see task-5-report.md for why).
  stats:
    heading: Cennso by the numbers
    cards:
      # Only this card (index 1, "20 years") has a standalone large-figure
      # text layer in the frames ("21", directly under a title that reads
      # "20 years" - a mismatch in the source design, shipped as drawn, not
      # corrected). Cards 0, 2 and 3 have no separate figure text node - the
      # only numbers are the ones already inside their titles below, so
      # `figure` is omitted for them rather than invented.
      - title: Available in over 170 locations
        description: >-
          Deployed in 170+ locations globally, Cennso delivers scalable
          network services for consumers and IoT on any Kubernetes platform:
          cloud, bare metal, or edge.
      - figure: '21'
        title: Over 20 years Experience
        description: >-
          Built on 20+ years of telecom expertise, Cennso and its solution
          partners help you create custom network solutions.
      - title: 3.000 Gbit/s peak Bandwidth
        description: >-
          Cennso's high-performance network functions maximize your hardware
          investment, reducing costs and operational complexity.
      - title: 24 Billion sessions per year
        description: >-
          Managing 24+ billion user sessions annually, Cennso's horizontally
          scalable platform scales with your network demands.
