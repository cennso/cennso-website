  whyCennso:
    heading: Why Cennso?
    cards:
      - title: 5G-Ready Edge
        description: >-
          Cennso enables you to deploy carrier-grade mobile core and packet
          gateway services in any location. From central clouds to regional
          edge sites. Manage distributed environments from a single control
          plane, deliver ultra-low-latency routing for critical IoT and mobility
          workloads, and provision remote infrastructure without dispatching
          telecom engineers onsite.
      - title: Agile MVNO
        description: >-
          Cennso gives you the agility to launch and scale virtual network
          services rapidly. Maintain reliable subscriber sessions across
          regions and clouds, run high-performance packet gateway functions,
          and seamlessly integrate HSS and roaming breakout. Providing the
          robust 4G LTE foundation needed to scale into next-generation 5G
          services.
      - title: Private 5G Core
        description: >-
          Cennso delivers dedicated, high-performance packet core and local
          breakout solutions for mission-critical enterprise environments.
          Connect seamlessly with your existing radio infrastructure and
          enterprise security, deploy only the specific gateway functions your
          facility requires, and unify multi-site operations under a single
          automated control plane.

  # Visually-hidden landmark heading for the 4-card stat grid - the design
  # has no on-canvas label for this section, so this exists only for
  # screen-reader/outline structure (see task-5-report.md for why).
  stats:
    heading: Cennso by the numbers
    cards:
      # Only this card (index 1, "20 years") has a standalone large-figure
      # text layer in the frames ("21", directly under a title that reads
      # "20 years" - a mismatch in the source design, shipped as drawn, not
      # corrected). Cards 0, 2 and 3 have no separate figure text node - the
      # only numbers are the ones already inside their titles below, so
      # `figure` is omitted for them rather than invented.
      - title: Available in over 170 locations
        description: >-
          Deployed in 170+ locations globally, Cennso delivers scalable
          network services for consumers and IoT on any Kubernetes platform:
          cloud, bare metal, or edge.
      - figure: '21'
        title: Over 20 years Experience
        description: >-
          Built on 20+ years of telecom expertise, Cennso and its solution
          partners help you create custom network solutions.
      - title: 3.000 Gbit/s peak Bandwidth
        description: >-
          Cennso's high-performance network functions maximize your hardware
          investment, reducing costs and operational complexity.
      - title: 24 Billion sessions per year
        description: >-
          Managing 24+ billion user sessions annually, Cennso's horizontally
          scalable platform scales with your network demands.
