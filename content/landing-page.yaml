page:
  title: Cennso - 5G Network Solutions for MVNOs and Private 5G
  description: >-
    Cennso lets you deploy 5G anywhere - build MVNOs, travel SIM solutions, or
    private networks with seamless interoperability and centralized control
    today.
  og:
    title: Build Network Solutions. Anywhere.

sections:
  # Hero: headline, supporting paragraph, and the design's one "cta" button
  # (links to /contact - fixed in pages/index.tsx, not configurable content).
  hero:
    # Two literal lines in the frames (two stacked <p> tags), not one
    # wrapped sentence - kept as a block scalar for that reason.
    headline: |-
      Build Network Solutions.
      Anywhere.
    description: >-
      Cennso lets you launch borderless mobile connectivity in hours: scale
      MVNOs, travel eSIM platforms, or 5G-ready enterprise breakout. All from a
      single, centralized control plane.
    ctaText: Book demo
    # One string for both theme cuts of the hero artwork - the two files draw
    # the same scene, only the palette differs.
    illustrationAlt: >-
      Illustration of a phone, cell tower, server racks and a globe connected
      together in a hexagon panel, with the Cennso wordmark on the server node

