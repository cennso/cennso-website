  description: Get in touch with Cennso's Solution and Channel Partners. Learn how we can help you build custom mobile core network solutions for your business needs.
  # Visible hero heading/paragraph shown on the page itself. Kept separate from
  # title/description above, which stay tuned for the <title> tag and meta
  # description - the two audiences want different copy.
  heading: Let's Talk About Your Project
  subheading: Connect with our experts to explore reliable solutions tailored to your business needs.

